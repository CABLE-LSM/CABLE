# Catalogue of CABLE output variables.
#
# Each entry describes what a variable is. How it is written (stream,
# aggregation, reduction, NetCDF name) is chosen by the output configuration
# file. Model-state pointers, unit conversions and valid ranges live in the
# Fortran binding modules, keyed by `name`.
#
#   name              User-facing field name; also the default NetCDF name.
#   dimensions        Names accepted by cable_output_get_dimension.
#   type              float or int.
#   parameter         Written once, without a time axis. Default false.
#   distributed       False if every rank holds a full copy. Default true.
#   native_frequency  How often the model itself updates the value. Default timestep.
#   group, module     Convenience selection for the output configuration.
#   restart_name      Present if the variable is written to restart files, under this name.
#   output            False for restart-only entries. Default true.
#   metadata          Variable attributes written to the NetCDF file.
variables:
  - name: "SWdown"
    dimensions: [patch]
    type: float
    group: met
    module: forcing
    metadata:
      units: "W/m^2"
      long_name: "Downward shortwave radiation"
  - name: "LWdown"
    dimensions: [patch]
    type: float
    group: met
    module: forcing
    metadata:
      units: "W/m^2"
      long_name: "Downward longwave radiation"
